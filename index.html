<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Books Manager</h1>
    <button id="btn-add" class="btn btn-primary">+ Add Book</button>
  </header>

  <main>
    <div id="search-bar">
      <input type="text" id="search" placeholder="Search by title or author..." />
    </div>
    <div id="books-grid"></div>
    <p id="empty-state" class="hidden">No books yet. Add your first one!</p>
  </main>

  <!-- Detail Modal -->
  <div id="modal-detail" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="modal-detail">&times;</button>
      <h2 id="detail-title"></h2>
      <p class="detail-meta"><span id="detail-author"></span> &bull; <span id="detail-year"></span></p>
      <p class="detail-genre" id="detail-genre"></p>
      <p id="detail-description"></p>
      <div class="modal-actions">
        <button id="detail-edit" class="btn btn-primary">Edit</button>
        <button id="detail-delete" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Form Modal -->
  <div id="modal-form" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" data-close="modal-form">&times;</button>
      <h2 id="form-title">Add Book</h2>
      <form id="book-form" novalidate>
        <input type="hidden" id="form-id" />
        <div class="field">
          <label for="form-book-title">Title *</label>
          <input type="text" id="form-book-title" required />
        </div>
        <div class="field">
          <label for="form-author">Author *</label>
          <input type="text" id="form-author" required />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="form-year">Year</label>
            <input type="number" id="form-year" min="1" max="2100" />
          </div>
          <div class="field">
            <label for="form-genre">Genre</label>
            <input type="text" id="form-genre" />
          </div>
        </div>
        <div class="field">
          <label for="form-description">Description</label>
          <textarea id="form-description" rows="4"></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" data-close="modal-form">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm Delete -->
  <div id="modal-confirm" class="modal hidden">
    <div class="modal-content modal-content--sm">
      <h2>Delete Book</h2>
      <p>Are you sure you want to delete <strong id="confirm-book-title"></strong>?</p>
      <div class="modal-actions">
        <button id="confirm-yes" class="btn btn-danger">Delete</button>
        <button class="btn btn-secondary" data-close="modal-confirm">Cancel</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
